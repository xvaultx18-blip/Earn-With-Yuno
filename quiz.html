<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quiz</title>

<!-- Ad Script -->
<script src='//libtl.com/sdk.js' data-zone='10923819' data-sdk='show_10923819'></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background: #121212;
    color: white;
    font-family: sans-serif;
}
.card {
    background: #1e1e1e;
}
.btn {
    background: orange;
    color: black;
    font-weight: bold;
}
</style>
</head>

<body class="max-w-md mx-auto p-4">

<h1 class="text-2xl font-bold text-center mb-6">🧠 Math Quiz</h1>

<div class="card p-4 rounded-lg">
    <p id="question" class="text-xl mb-4">Loading...</p>

    <input id="answer" type="number" placeholder="Answer likho"
        class="w-full p-3 mb-3 rounded bg-gray-800">

    <button onclick="submitAnswer()" 
        class="w-full p-3 rounded btn">
        Submit Answer
    </button>
</div>

<p class="text-center mt-4">
    Coins: <span id="coins">0</span>
</p>

<script type="module">

/* ================= FIREBASE ================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBV57_B1GRG2zeO8xqGj39hE4y7zBbLSGk",
  authDomain: "earn-with-yuno.firebaseapp.com",
  projectId: "earn-with-yuno",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userData = null;

/* ================= AUTH CHECK ================= */

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;

        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);

        if (snap.exists()) {
            userData = snap.data();
            document.getElementById('coins').textContent = userData.balance || 0;
        } else {
            alert("User data nahi mila");
        }

    } else {
        alert("Login karo pehle");
        window.location.href = "index.html";
    }
});

/* ================= QUIZ ================= */

let correctAnswer = 0;

// Question generator
function generateQuestion() {
    const num1 = Math.floor(Math.random() * 10) + 1;
    const num2 = Math.floor(Math.random() * 10) + 1;

    const ops = ['+', '-', 'x'];
    const op = ops[Math.floor(Math.random() * ops.length)];

    let q = `${num1} ${op} ${num2}`;

    switch(op) {
        case '+': correctAnswer = num1 + num2; break;
        case '-': correctAnswer = num1 - num2; break;
        case 'x': correctAnswer = num1 * num2; break;
    }

    document.getElementById('question').textContent = q;
}

/* ================= BALANCE UPDATE ================= */

async function updateBalance(amount) {
    if (!currentUser || !userData) return;

    const userRef = doc(db, "users", currentUser.uid);
    const newBalance = (userData.balance || 0) + amount;

    await updateDoc(userRef, { balance: newBalance });

    userData.balance = newBalance;
    document.getElementById('coins').textContent = newBalance;
}

/* ================= SUBMIT ================= */

window.submitAnswer = async function() {
    const userAns = parseInt(document.getElementById('answer').value);

    if (isNaN(userAns)) {
        alert("Answer daalo!");
        return;
    }

    if (!window.show_10923819) {
        alert("Ad load nahi hua");
        return;
    }

    try {
        // Ad show
        await window.show_10923819();

        // Check answer
        if (userAns === correctAnswer) {
            await updateBalance(25);
            alert("✅ Correct! +25 coins");
        } else {
            alert("❌ Galat! Answer: " + correctAnswer);
        }

        document.getElementById('answer').value = "";
        generateQuestion();

    } catch (e) {
        alert("Ad show nahi hua");
        console.error(e);
    }
}

/* ================= START ================= */

generateQuestion();

</script>

</body>
</html>
